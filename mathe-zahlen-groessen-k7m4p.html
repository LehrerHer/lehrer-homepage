<style>

*{box-sizing:border-box}

<body>
<header><div class="in">
  <h1>🚀 Mathe-Training: Zahlen und Größen</h1>
  <div id="hud"></div>
</div></header>
<main id="main"></main>

<script>
/* ---------- Helfer ---------- */
const R=(a,b)=>Math.floor(Math.random()*(b-a+1))+a;
const pick=a=>a[R(0,a.length-1)];
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=R(0,i);[a[i],a[j]]=[a[j],a[i]];}return a;};
const fmt=x=>{const s=typeof x==='string'?x:String(Math.round(x*1000)/1000);let [i,d]=s.split('.');i=i.replace(/\B(?=(\d{3})+(?!\d))/g,' ');return d?i+','+d:i;};
function parseV(s){s=s.replace(/[\s  ]/g,'').replace(/\.(?=\d{3}(\D|$))/g,'').replace(',','.');return /^\d+(\.\d+)?$/.test(s)?s:null;}
function same(inp,ans,f){if(inp.trim()===''&&f.opt)inp='0';const s=parseV(inp);if(s===null)return false;
  if(typeof ans==='string')return s.replace(/^0+(?=\d)/,'')===ans;return Math.abs(Number(s)-ans)<1e-6;}
function el(tag,cls,html){const e=document.createElement(tag);if(cls)e.className=cls;if(html!=null)e.innerHTML=html;return e;}
const pad2=n=>String(n).padStart(2,'0');
const NAMES=['Mia','Ben','Lina','Jonas','Emma','Paul','Nele','Tom'];

/* ---------- Zahlwörter ---------- */
const ONES=['','ein','zwei','drei','vier','fünf','sechs','sieben','acht','neun','zehn','elf','zwölf','dreizehn','vierzehn','fünfzehn','sechzehn','siebzehn','achtzehn','neunzehn'];
const TENS=['','','zwanzig','dreißig','vierzig','fünfzig','sechzig','siebzig','achtzig','neunzig'];
function u1000(n,end){const h=Math.floor(n/100),r=n%100;let s=h?ONES[h]+'hundert':'';
  if(r<20)s+=(r===1&&end)?'eins':ONES[r];else{const e=r%10;s+=(e?ONES[e]+'und':'')+TENS[Math.floor(r/10)];}return s;}
const NM=[['',''],['Tausend','Tausend'],['Million','Millionen'],['Milliarde','Milliarden'],['Billion','Billionen'],['Billiarde','Billiarden'],['Trillion','Trillionen']];
function wort(n){if(n===0)return 'null';const g=[];let x=n;while(x>0){g.push(x%1000);x=Math.floor(x/1000);}
  const p=[];for(let i=g.length-1;i>=2;i--)if(g[i])p.push(g[i]===1?'eine '+NM[i][0]:u1000(g[i],false)+' '+NM[i][1]);
  let low='';if(g[1])low+=u1000(g[1],false)+'tausend';if(g[0])low+=u1000(g[0],true);if(low)p.push(low);return p.join(' ');}
const normW=s=>s.toLowerCase().replace(/[\s\-  ]/g,'').replace(/ß/g,'ss')
  .replace(/(?<=^|millionen|million|milliarden|milliarde|billionen|billion|tausend)ein(?=hundert|tausend)/g,'');
const upperOk=v=>v===1||v%100!==1;
function bigNum(k,pz){let n=0;for(let i=k-1;i>=0;i--){let v;
    if(i===k-1){do{v=pick([R(1,9),R(10,99),R(1,9)*10]);}while(i>=2&&!upperOk(v));}
    else if(Math.random()<pz)v=0;else{do{v=pick([R(1,9),R(1,9)*10,R(1,9)*100,R(11,99),R(101,999)]);}while(i>=2&&!upperOk(v));}
    n=n*1000+v;}return n;}
const nm=(v,i)=>v+' '+(v===1?NM[i][0]:NM[i][1]);

/* ---------- Zahlenstrahl ---------- */
function strahl(c){const x0=34,x1=650,n=c.n,dx=(x1-x0)/n;
  let s='<svg class="strahl" viewBox="0 0 700 96" role="img" aria-label="Zahlenstrahl">';
  s+=`<line x1="${c.start?8:x0}" y1="50" x2="684" y2="50" class="ax"/><path d="M684 44 L696 50 L684 56 Z" class="arr"/>`;
  for(let i=0;i<=n;i++){const x=(x0+i*dx).toFixed(1),big=i%c.every===0,mid=!big&&c.every%2===0&&i%(c.every/2)===0,h=big?13:mid?9:6;
    s+=`<line x1="${x}" y1="${50-h}" x2="${x}" y2="${50+h}" class="tk"/>`;
    if(big)s+=`<text x="${x}" y="82" class="lb">${fmt(c.start+i*c.step)}</text>`;}
  (c.marks||[]).forEach(m=>{const x=+(x0+m.i*dx).toFixed(1);
    s+=`<text x="${x}" y="16" class="mk">${m.l}</text><path d="M${x} 21 V33 M${x-4} 29 L${x} 34 L${x+4} 29" class="mka"/>`;});
  if(c.click){s+='<circle class="sel" cx="0" cy="50" r="7" visibility="hidden"/>';
    for(let i=0;i<=n;i++)s+=`<rect class="hit" data-i="${i}" data-x="${(x0+i*dx).toFixed(1)}" x="${(x0+i*dx-dx/2).toFixed(1)}" y="20" width="${dx.toFixed(1)}" height="60"/>`;}
  return s+'</svg>';}
function lineCfg(l){
  if(l===0)return{start:0,step:pick([1,2,10,100]),n:20,every:5};
  if(l===1)return{start:0,...pick([{step:25,every:4,n:16},{step:20,every:5,n:20},{step:50,every:4,n:16},{step:250,every:4,n:16},{step:5,every:10,n:20},{step:500,every:10,n:20},{step:2000,every:5,n:20}])};
  const st=pick([20,50,200,250,500,2000,5000,25000]);return{start:st*10*R(3,40),step:st,n:20,every:10};}
function freeTicks(c,k){const a=[];for(let i=1;i<c.n;i++)if(i%c.every)a.push(i);return shuffle(a).slice(0,k).sort((x,y)=>x-y);}
function gLine(l,i){const c=lineCfg(l),v=t=>c.start+t*c.step;
  const how=`Zwischen zwei beschrifteten Strichen liegen ${c.every} Abschnitte: ${fmt(c.step*c.every)} : ${c.every} = ${fmt(c.step)} pro Abschnitt.`;
  if(i%2===0){const [a,b]=freeTicks(c,2);
    return{type:'input',q:'Welche Zahlen sind bei A und B markiert?'+strahl({...c,marks:[{i:a,l:'A'},{i:b,l:'B'}]}),
      fields:[{pre:'A ='},{pre:'B ='}],ans:[v(a),v(b)],sol:`${how} A = ${fmt(v(a))}, B = ${fmt(v(b))}.`};}
  const [a]=freeTicks(c,1),base=Math.floor(a/c.every)*c.every;
  return{type:'click',q:`Markiere die Zahl <b>${fmt(v(a))}</b>. Klicke auf den passenden Strich.`,line:c,ans:a,
    sol:`${how} ${fmt(v(a))} liegt ${a-base} ${a-base===1?'Strich':'Striche'} rechts von ${fmt(v(base))}.`};}

/* ---------- Bilddiagramm ---------- */
const THEMES=[
  {t:'Besucher im Freibad',rows:['Montag','Dienstag','Mittwoch','Donnerstag'],u:'Besucher',s:'🏊',ws:[10,50,100]},
  {t:'Verkaufte Eiskugeln',rows:['Vanille','Schoko','Erdbeere','Zitrone'],u:'Kugeln',s:'🍦',ws:[10,20,100]},
  {t:'Ausgeliehene Bücher',rows:['Januar','Februar','März','April'],u:'Bücher',s:'📕',ws:[10,20,50]},
  {t:'Zuschauer beim Stadtfest',rows:['Theater','Zirkus','Konzert','Sportshow'],u:'Zuschauer',s:'🙂',ws:[100,200,1000]},
  {t:'Einwohner von vier Städten',rows:['Nordheim','Seedorf','Bergstadt','Waldau'],u:'Einwohner',s:'🧍',ws:[10000,100000]}];
const sym=(s,c)=>`<span class="sym">${s}</span>`.repeat(Math.floor(c))+(c%1?`<span class="sym h">${s}</span>`:'');
function picto(th,counts,w,legend){return `<div class="pic"><div class="ti">${th.t}</div>`+
  th.rows.map((r,i)=>`<div class="pr"><span class="nm">${r}</span><span class="sy">${sym(th.s,counts[i])}</span></div>`).join('')+
  `<div class="leg"><span class="sym">${th.s}</span> = ${legend?fmt(w)+' '+th.u:'?'}</div></div>`;}
const cTxt=c=>(Math.floor(c)||(c%1?'':'0'))+(c%1?'½':'');
function distinct(n,a,b,half){let c;do{c=Array.from({length:n},()=>half?R(a*2,b*2)/2:R(a,b));}while(new Set(c).size<n||(half&&c.every(x=>x%1===0)));return c;}
function gPicRead(l,i){const th=pick(THEMES),w=pick(th.ws);
  if(l===0){const c=distinct(4,1,9),k=R(0,3);
    return{type:'input',q:`Wie viele ${th.u} gehören zu „${th.rows[k]}“?`+picto(th,c,w,true),fields:[{post:th.u}],ans:[c[k]*w],sol:`${c[k]} Symbole · ${fmt(w)} = ${fmt(c[k]*w)}.`};}
  if(l===1){const c=distinct(4,1,9);
    if(i%2===0){const [a,b]=shuffle([0,1,2,3]),hi=c[a]>c[b]?a:b,lo=hi===a?b:a,d=c[hi]-c[lo];
      return{type:'input',q:`Wie viele ${th.u} sind es bei „${th.rows[hi]}“ mehr als bei „${th.rows[lo]}“?`+picto(th,c,w,true),fields:[{post:th.u}],ans:[d*w],
        sol:`Unterschied: ${d} Symbole; ${d} · ${fmt(w)} = ${fmt(d*w)}.`};}
    const s=c.reduce((x,y)=>x+y,0);
    return{type:'input',q:`Wie viele ${th.u} sind es insgesamt?`+picto(th,c,w,true),fields:[{post:th.u}],ans:[s*w],sol:`Zusammen ${s} Symbole; ${s} · ${fmt(w)} = ${fmt(s*w)}.`};}
  const k=i%3;
  if(k===0){const c=distinct(4,2,9),r=R(0,3),v=c[r]*w;
    return{type:'input',q:`Im Bilddiagramm wurden die Zahlen auf ganze Symbole gerundet. Wie groß kann die genaue Zahl bei „${th.rows[r]}“ mindestens und höchstens gewesen sein?`+picto(th,c,w,true),
      fields:[{pre:'mindestens'},{pre:'höchstens'}],ans:[v-w/2,v+w/2-1],sol:`${c[r]} Symbole stehen für ${fmt(v)}. Ab ${fmt(v-w/2)} wird aufgerundet, bis ${fmt(v+w/2-1)} wird abgerundet.`};}
  const c=distinct(4,1,7,true);
  if(k===1){const s=c.reduce((x,y)=>x+y,0),r=R(0,3);
    return{type:'input',q:`Die Legende fehlt. Bekannt ist: Insgesamt sind es ${fmt(s*w)} ${th.u}. Wofür steht ein ganzes Symbol? Wie viele ${th.u} gehören zu „${th.rows[r]}“?`+picto(th,c,w,false),
      fields:[{pre:'1 Symbol ='},{pre:`„${th.rows[r]}“ =`}],ans:[w,c[r]*w],
      sol:`Zähle in halben Symbolen: ${s*2} halbe Symbole. ${fmt(s*w)} : ${s*2} = ${fmt(w/2)} je halbes Symbol, also ${fmt(w)} je Symbol. „${th.rows[r]}“: ${fmt(c[r]*w)}.`};}
  const [a,b]=shuffle([0,1,2,3]),hi=c[a]>c[b]?a:b,lo=hi===a?b:a,d=c[hi]-c[lo];
  return{type:'input',q:`Hier gibt es auch halbe Symbole. Wie viele ${th.u} sind es bei „${th.rows[hi]}“ mehr als bei „${th.rows[lo]}“?`+picto(th,c,w,true),fields:[{post:th.u}],ans:[d*w],
    sol:`Unterschied: ${cTxt(d)} Symbole. Ein halbes Symbol steht für ${fmt(w/2)}. Ergebnis: ${fmt(d*w)}.`};}
function gPicMake(l,i){const th=pick(THEMES),w=pick(th.ws);
  const off=m=>{const o=R(1,Math.max(1,m));return Math.random()<.5?o:-o;};
  if(l===0&&i%2===0){const c=R(2,18),v=c*w+off(w/2-1);
    return{type:'input',q:`Ein Symbol steht für ${fmt(w)} ${th.u}. Wie viele Symbole zeichnest du für <b>${fmt(v)} ${th.u}</b>?`,fields:[{post:'Symbole'}],ans:[c],
      sol:`Runde zuerst: ${fmt(v)} ≈ ${fmt(c*w)}. ${fmt(c*w)} : ${fmt(w)} = ${c} Symbole.`};}
  if(l===0){const ans=distinct(4,1,8);return{type:'picto',step:1,q:`Erstelle das Bilddiagramm. Ein Symbol steht für <b>${fmt(w)} ${th.u}</b>.`,th,w,vals:ans.map(a=>a*w),ans,
    sol:th.rows.map((r,j)=>`${r}: ${ans[j]} Symbole`).join('; ')+'.'};}
  if(l===1){const ans=distinct(4,1,8),vals=ans.map((a,j)=>j===0&&Math.random()<.4?a*w-w/2:a*w+off(w/2-1));
    return{type:'picto',step:1,q:`Runde die Zahlen zuerst passend. Erstelle dann das Bilddiagramm. Ein Symbol steht für <b>${fmt(w)} ${th.u}</b>.`,th,w,vals,ans,
      sol:th.rows.map((r,j)=>`${r}: ${fmt(vals[j])} ≈ ${fmt(ans[j]*w)} → ${ans[j]} Symbole`).join('; ')+'. Liegt eine Zahl genau in der Mitte, wird aufgerundet.'};}
  const k=i%3;
  if(k===0){const ans=distinct(4,1,7,true),vals=ans.map(a=>a*w+off(Math.ceil(w/4)-1));
    return{type:'picto',step:.5,q:`Jetzt mit halben Symbolen: Runde auf ${fmt(w/2)} genau und erstelle das Bilddiagramm. Ein Symbol steht für <b>${fmt(w)} ${th.u}</b>.`,th,w,vals,ans,
      sol:th.rows.map((r,j)=>`${r}: ≈ ${fmt(ans[j]*w)} → ${cTxt(ans[j])} Symbole`).join('; ')+'.'};}
  if(k===1){const f=pick([1,10,100]),vals=distinct(4,2,9).map(x=>x*100*f);
    return{type:'mc',q:`Du sollst diese Zahlen in einem Bilddiagramm darstellen: ${vals.map(fmt).join(', ')}. Welcher Wert für ein Symbol ist sinnvoll?`,
      opts:shuffle([{h:`1 Symbol = ${fmt(100*f)}`,ok:true,why:'Du brauchst pro Zeile höchstens 9 Symbole und kannst alle Zahlen genau darstellen.'},
        {h:`1 Symbol = ${fmt(f)}`,why:`Dann müsstest du bis zu ${fmt(Math.max(...vals)/f)} Symbole in eine Zeile zeichnen.`},
        {h:`1 Symbol = ${fmt(10000*f)}`,why:'Dann wären alle Zahlen kleiner als ein einziges Symbol.'}])};}
  const c=R(2,12),v=c*w+w/2;
  return{type:'input',q:`Ein Symbol steht für ${fmt(w)} ${th.u}. Du zeichnest nur ganze Symbole. Wie viele Symbole zeichnest du für genau <b>${fmt(v)} ${th.u}</b>?`,fields:[{post:'Symbole'}],ans:[c+1],
    sol:`${fmt(v)} liegt genau in der Mitte zwischen ${fmt(c*w)} und ${fmt((c+1)*w)}. Vereinbarung: Dann wird aufgerundet, also ${c+1} Symbole.`};}

/* ---------- Spielstand ---------- */
const prog=UNITS.map(()=>[0,0,0]);let pts=0,streak=0,cur=-1,lvl=0,rd=null;
const LV=['🌱 Basis','🚀 Fortgeschritten','🏆 Experte'];
const PRAISE=['Super!','Stark!','Genau richtig!','Klasse!','Top!','Volltreffer!','Spitze!'];
const stars=()=>prog.flat().reduce((a,b)=>a+b,0);
function rank(){const s=stars();return s>=33?'🏅 Mathe-Champion':s>=22?'🥇 Mathe-Ass':s>=12?'🥈 Größen-Profi':s>=5?'🥉 Rechen-Entdecker':'🎒 Zahlen-Starter';}
function hud(){document.getElementById('hud').innerHTML=`<span>⭐ ${stars()} von ${UNITS.length*3} Sternen</span><span>💎 ${pts} Punkte</span><span>${rank()}</span>`+(streak>=3?`<span>🔥 ${streak} in Folge</span>`:'');}
function confetti(){for(let i=0;i<26;i++){const c=el('span','conf',pick(['⭐','🎉','✨','🎈','💜']));c.style.left=R(2,96)+'vw';c.style.animationDelay=(R(0,60)/100)+'s';document.body.append(c);setTimeout(()=>c.remove(),2600);}}
const M=()=>document.getElementById('main');

/* ---------- Aufgaben anzeigen ---------- */
function renderTask(t,host,done){
  window._last=t;
  const c=el('div','task');c.append(el('div','q',t.q));
  const body=el('div','row');c.append(body);
  const fb=el('div','fb');let over=false,tries=0;
  const solBtn=el('button','g','💡 Lösung zeigen');solBtn.hidden=true;
  const end=first=>{over=true;solBtn.hidden=true;done(first,c);};
  solBtn.onclick=()=>{if(over)return;c.classList.add('bad');fb.innerHTML='Lösung:<span class="why">'+t.sol+'</span>';end(null);};
  const finish=(ok,why,final)=>{if(over)return;tries++;
    if(ok){c.classList.remove('bad');c.classList.add('ok');fb.innerHTML='✓ '+pick(PRAISE)+'<span class="why">'+(why||t.sol||'')+'</span>';end(tries===1);}
    else{c.classList.add('bad');fb.innerHTML=(final?'✗ Leider nicht.':'✗ Fast! Versuch es noch einmal.')+(why?'<span class="why">'+why+'</span>':'');if(final)end(null);else solBtn.hidden=false;}};
  const addCheck=fn=>{const b=el('button','b','Prüfen');b.onclick=()=>finish(fn());body.append(b);return b;};
  if(t.type==='input'){
    const ins=t.fields.map(f=>{if(f.pre)body.append(el('span','',f.pre));
      const i=el('input',f.w||'');i.type='text';i.autocomplete='off';i.inputMode=t.text?'text':'decimal';body.append(i);
      if(f.post)body.append(el('span','',f.post));return i;});
    const b=addCheck(()=>ins.every((i,k)=>t.text?normW(i.value)===normW(t.ans[k]):same(i.value,t.ans[k],t.fields[k])));
    ins.forEach(i=>i.addEventListener('keydown',e=>{if(e.key==='Enter'&&!over)b.click();}));
    setTimeout(()=>ins[0].focus({preventScroll:true}),0);
  }else if(t.type==='cmp'){
    const d=el('span','cmp',`${fmt(t.a)} <span class="slot">▢</span> ${fmt(t.b)}`);body.append(d);
    ['<','=','>'].forEach(s=>{const b=el('button','g',s==='<'?'&lt;':s==='>'?'&gt;':'=');b.dataset.s=s;b.onclick=()=>{if(over)return;d.querySelector('.slot').textContent=s;finish(s===t.ans,s===t.ans?'':'Richtig ist: '+t.sol,true);};body.append(b);});
  }else if(t.type==='mc'){
    const good=t.opts.find(o=>o.ok);t.sol=good.h+' – '+good.why;
    t.opts.forEach(o=>{const b=el('button','g',o.h);if(o.ok)b.dataset.ok=1;b.onclick=()=>finish(!!o.ok,o.ok?o.why:o.why+(o.why===good.why?'':' Richtig ist: '+good.h+'.'),true);body.append(b);});
  }else if(t.type==='order'){
    t.sol=t.sorted.map(fmt).join(t.sep);
    const pool=el('div','row'),ans=el('div','row ans');let seq=[];
    const draw=()=>{pool.innerHTML='';ans.innerHTML='';
      t.nums.filter(n=>!seq.includes(n)).forEach(n=>{const b=el('button','chip',fmt(n));b.dataset.n=n;b.onclick=()=>{if(!over){seq.push(n);draw();}};pool.append(b);});
      seq.forEach((n,i)=>ans.append(el('span','',(i?t.sep:'')+fmt(n))));};
    draw();body.append(pool,ans);
    addCheck(()=>seq.length===t.sorted.length&&seq.every((n,i)=>n===t.sorted[i]));
    const r=el('button','g','↺ Zurücksetzen');r.onclick=()=>{if(!over){seq=[];draw();}};body.append(r);
  }else if(t.type==='click'){
    const w=el('div','');w.style.width='100%';w.innerHTML=strahl({...t.line,click:true});body.append(w);let sel=-1;
    const dot=w.querySelector('.sel');
    w.querySelectorAll('.hit').forEach(h=>h.addEventListener('click',()=>{if(over)return;sel=+h.dataset.i;dot.setAttribute('cx',h.dataset.x);dot.setAttribute('visibility','visible');}));
    addCheck(()=>sel===t.ans);
  }else if(t.type==='picto'){
    const cnt=t.vals.map(()=>0),w=el('div','pic');w.append(el('div','ti',t.th.t));
    t.th.rows.forEach((r,i)=>{const row=el('div','pr');row.append(el('span','nm',`${r}<br><small>${fmt(t.vals[i])}</small>`));
      const sy=el('span','sy'),m=el('button','g pm',t.step===1?'−':'−½'),p=el('button','g pm plus',t.step===1?'+':'+½');
      m.onclick=()=>{if(!over&&cnt[i]>0){cnt[i]-=t.step;sy.innerHTML=sym(t.th.s,cnt[i]);}};
      p.onclick=()=>{if(!over&&cnt[i]<12){cnt[i]+=t.step;sy.innerHTML=sym(t.th.s,cnt[i]);}};
      row.append(m,p,sy);w.append(row);});
    w.append(el('div','leg',`<span class="sym">${t.th.s}</span> = ${fmt(t.w)} ${t.th.u}`));
    body.append(w);addCheck(()=>cnt.every((x,i)=>x===t.ans[i]));
  }
  body.append(solBtn);c.append(fb);host.append(c);
}

/* ---------- Runde ---------- */
function startRound(host){rd={i:0,first:0,n:5,off:R(0,11),res:[]};step(host);}
function step(host){
  host.innerHTML='';
  const dots=el('div','dots');for(let j=0;j<rd.n;j++)dots.append(el('span','dot '+(j<rd.i?rd.res[j]:j===rd.i?'now':'')));
  dots.append(el('span','',`Aufgabe ${rd.i+1} von ${rd.n}`));host.append(dots);
  renderTask(UNITS[cur].levels[lvl](rd.i+rd.off),host,(first,card)=>{
    if(first){rd.first++;pts+=10;streak++;}else{streak=0;if(first===false)pts+=5;}
    rd.res.push(first?'ok':first===false?'half':'no');hud();
    const nx=el('button','b go',rd.i+1<rd.n?'Weiter ➜':'Ergebnis ansehen ➜');nx.style.marginTop='10px';
    nx.onclick=()=>{rd.i++;if(rd.i<rd.n)step(host);else finishRound(host);};card.append(nx);nx.focus({preventScroll:true});});
}
function finishRound(host){
  const win=rd.first>=4,was=prog[cur][lvl];if(win)prog[cur][lvl]=1;hud();
  host.innerHTML='';const e=el('div','end');
  e.append(el('div','big',win?(rd.first===5?'🏆':'⭐'):'💪'),
    el('h3','',win?(rd.first===5?'Perfekt! Alles auf Anhieb richtig.':'Stark! Stern geschafft.'):'Das wird! Übung macht den Meister.'),
    el('p','',`Du hast <b>${rd.first} von ${rd.n}</b> Aufgaben auf Anhieb gelöst.`+(win?(was?'':' Du bekommst einen Stern für dieses Niveau.'):' Für den Stern brauchst du 4 von 5.')));
  const row=el('div','row');
  const again=el('button','g','🔁 Noch eine Runde');again.onclick=()=>startRound(host);row.append(again);
  if(win&&lvl<2){const n=el('button','b','Nächstes Niveau ➜');n.onclick=()=>{lvl++;drawUnit();};row.append(n);}
  const h=el('button','g','🏠 Zur Übersicht');h.onclick=home;row.append(h);
  e.append(row);host.append(e);if(win)confetti();
  /* XP: Auf-Anhieb-Treffer der Runde → Notenpunkte-System (nur Verbesserungen zählen serverseitig) */
  if(rd.first>0&&typeof window.kolosseumReport==='function'){
    try{window.kolosseumReport(rd.first,rd.n,'mathe-zg-'+UNITS[cur].slug+'-'+(lvl+1));}catch(err){console.warn('XP-Meldung fehlgeschlagen',err);}
  }
}

/* ---------- Seiten ---------- */
function starsHTML(i){return '<span class="st">'+prog[i].map(x=>x?'<i>★</i>':'★').join('')+'</span>';}
function home(){cur=-1;hud();const m=M();m.innerHTML='';
  m.append(el('div','hello',`<b>Hallo! 👋</b> Hier trainierst du alle Themen von deiner Checkliste. Wähle ein Thema, lies die Erklärung und löse 5 Aufgaben. Schaffst du 4 davon auf Anhieb, bekommst du einen ⭐. In jedem Thema gibt es drei Sterne: Basis, Fortgeschritten und Experte.<br><small>⚔️ Mit Login im Lernkolosseum bekommst du für jede Runde XP – nach dem Notenpunkte-System.</small>`));
  [['Pflichtteil',u=>!u.wahl],['Wahlpflichtteil',u=>u.wahl]].forEach(([name,f])=>{
    m.append(el('h3','sec',name));const g=el('div','grid');
    UNITS.forEach((u,i)=>{if(!f(u))return;const b=el('button','ucard'+(prog[i].every(x=>x)?' done':''),`<span class="ic">${u.ic}</span><span><b>${u.t}</b>${starsHTML(i)}</span>`);
      b.onclick=()=>{cur=i;const l=prog[i].indexOf(0);lvl=l<0?0:l;drawUnit();window.scrollTo(0,0);};g.append(b);});
    m.append(g);});
  m.append(el('p','foot','Tipp: Rechne schwierige Aufgaben zuerst im Heft. Deine Sterne gelten, solange die Seite geöffnet ist.'));
}
function drawUnit(){hud();const u=UNITS[cur],m=M();m.innerHTML='';
  const back=el('button','back','← Zur Übersicht');back.onclick=home;
  m.append(back,el('div','',`<span class="tag">${u.wahl?'Wahlpflichtteil':'Pflichtteil'}</span>`),el('h2','',u.ic+' '+u.full));
  const d=el('details','ex','<summary>📖 Erklärung und Beispiel</summary>'+u.intro);d.open=!prog[cur].some(x=>x);m.append(d);
  const lv=el('div','lv'),host=el('div','');
  LV.forEach((n,i)=>{const b=el('button',i===lvl?'on':'',n+(prog[cur][i]?' ⭐':''));b.onclick=()=>{lvl=i;drawUnit();};lv.append(b);});
  m.append(lv,host);startRound(host);
}
home();
</script>
