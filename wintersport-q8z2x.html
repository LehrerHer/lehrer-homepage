async function sha256(str) {
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(str));
  return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
}
function levenshtein(a,b) {
  const m=a.length,n=b.length;
  const dp=Array.from({length:m+1},(_,i)=>Array.from({length:n+1},(_,j)=>i===0?j:j===0?i:0));
  for(let i=1;i<=m;i++) for(let j=1;j<=n;j++)
    dp[i][j]=a[i-1]===b[j-1]?dp[i-1][j-1]:1+Math.min(dp[i-1][j],dp[i][j-1],dp[i-1][j-1]);
  return dp[m][n];
}
function normalize(s) {
  return s.toLowerCase().trim()
    .replace(/ä/g,'ae').replace(/ö/g,'oe').replace(/ü/g,'ue').replace(/ß/g,'ss')
    .replace(/\s+/g,' ');
}
function isClose(input,label) {
  const a=normalize(input),b=normalize(label);
  if(a===b) return false;
  if(levenshtein(a,b)<=3) return true;
  const bLast=b.split(' ').pop(), aLast=normalize(input).split(' ').pop();
  return levenshtein(aLast,bLast)<=2;
}

}

  for(let i=0;i<N;i++) {
    const btn=document.createElement('button');
    btn.className='thumb-btn'+(i===current?' active':'');
    if(answered[i]==='correct') btn.classList.add('done-correct');
    else if(answered[i]==='close') btn.classList.add('done-close');
    else if(answered[i]==='wrong') btn.classList.add('done-wrong');
    const img=document.createElement('img'); img.src=IMAGES[i]; img.alt='Bild '+(i+1);
    btn.appendChild(img);
    btn.addEventListener('click',()=>{current=i;renderCard();});
    thumbGrid.appendChild(btn);
  }
}

function renderCard() {
  const card=document.getElementById('question-card');
  card.style.animation='none'; void card.offsetWidth; card.style.animation='';
  quizImg.src=IMAGES[current];
  qNumber.textContent='FRAGE '+String(current+1).padStart(2,'0');
  medalRow.innerHTML='';
  for(let i=0;i<N;i++) {
    const m=document.createElement('div');
    m.className='medal '+(answered[i]==='correct'?'correct':answered[i]==='close'?'close':answered[i]==='wrong'?'wrong':'pending');
    medalRow.appendChild(m);
  }
  answerInput.value=givenAnswers[current]||'';
  answerInput.className='answer-input';
  feedbackEl.className='feedback'; feedbackEl.textContent='';
  bioCard.className='bio-card'; bioCard.innerHTML='';
  revealBanner.className='reveal-banner';

  if(answered[current]) {
    answerInput.disabled=true; btnCheck.disabled=true;
    const st=answered[current];
    if(st==='correct') { answerInput.classList.add('correct'); showFeedback('correct','&#9989; Richtig! +100 Punkte'); }
    else if(st==='close') { answerInput.classList.add('close'); showFeedback('close','&#128993; Fast richtig! +50 Punkte'); }
    else { answerInput.classList.add('wrong'); showFeedback('wrong','&#10060; Leider falsch.'); }
    bioCard.innerHTML=buildBioCard(current);
    bioCard.classList.add('show');
    revealName.textContent=LABELS[current];
    revealBanner.classList.add('show');
  } else {
    answerInput.disabled=false; btnCheck.disabled=false; answerInput.focus();
  }

  const done=answered.filter(a=>a!==null).length;
  progressBar.style.width=((done/N)*100)+'%';
  progressLabel.textContent='Frage '+(current+1)+' von '+N;
  document.getElementById('score-display').textContent=score;
  document.getElementById('correct-display').textContent=answered.filter(a=>a==='correct').length;
  document.getElementById('remaining-display').textContent=N-done;
  btnPrev.style.display=current===0?'none':'';
  btnFinish.style.display=answered.every(a=>a!==null)?'':'none';
  btnNext.textContent=current===N-1?'Zurück zu 1 →':'Nächste →';
  buildThumbs();
}
function showFeedback(type,msg) { feedbackEl.className='feedback '+type; feedbackEl.innerHTML=msg; }

async function checkAnswer() {
  const raw=answerInput.value.trim(); if(!raw) return;
  givenAnswers[current]=raw;
  const h=await sha256(raw.toLowerCase().trim());
  if(h===HASHES[current]) { answered[current]='correct'; score+=100; }
  else if(isClose(raw,LABELS[current])) { answered[current]='close'; score+=50; }
  else { answered[current]='wrong'; }
  renderCard();
}
btnCheck.addEventListener('click',checkAnswer);
answerInput.addEventListener('keydown',e=>{if(e.key==='Enter'&&!btnCheck.disabled)checkAnswer();});
btnPrev.addEventListener('click',()=>{if(current>0){current--;renderCard();}});
btnNext.addEventListener('click',()=>{current=(current+1)%N;renderCard();});
btnFinish.addEventListener('click',showResults);
document.getElementById('btn-restart').addEventListener('click',restartQuiz);

function showResults() {
  quizScreen.style.display='none'; resultsScreen.style.display='block';
  const corr=answered.filter(a=>a==='correct').length;
  const close=answered.filter(a=>a==='close').length;
  const total=corr+close;
  document.getElementById('final-score').textContent=score;
  const te=document.getElementById('trophy-emoji'),se=document.getElementById('final-sub');
  if(total===12){te.textContent='&#129351;';se.textContent='Perfekt! Alle Legenden erkannt!';}
  else if(total>=9){te.textContent='&#127942;';se.textContent=total+' von 12 erkannt – Klasse!';}
  else if(total>=6){te.textContent='&#129352;';se.textContent=total+' von 12 erkannt – Gut gemacht!';}
  else{te.textContent='&#9975;&#65039;';se.textContent=total+' von 12 – Noch etwas üben!';}
  const list=document.getElementById('results-list'); list.innerHTML='';
  for(let i=0;i<N;i++) {
    const row=document.createElement('div'); row.className='result-row';
    const thumb=document.createElement('img'); thumb.src=IMAGES[i]; thumb.className='result-thumb';
    const info=document.createElement('div'); info.className='result-info';
    const nm=document.createElement('div'); nm.className='result-name'; nm.textContent=LABELS[i];
    const gv=document.createElement('div'); gv.className='result-given';
    gv.textContent=givenAnswers[i]?('Deine Antwort: '+givenAnswers[i]):'Nicht beantwortet';
    info.appendChild(nm); info.appendChild(gv);
    const icon=document.createElement('div'); icon.className='result-icon';
    icon.textContent=answered[i]==='correct'?'✅':answered[i]==='close'?'🟡':'❌';
    row.appendChild(thumb); row.appendChild(info); row.appendChild(icon);
    list.appendChild(row);
  }
}
function restartQuiz() {
  current=0; answered=new Array(N).fill(null); givenAnswers=new Array(N).fill(''); score=0;
  quizScreen.style.display=''; resultsScreen.style.display='none'; renderCard();
}
renderCard();
</script>
</body>
</html>
