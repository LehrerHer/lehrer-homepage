<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    .admin-nav { background: #12122a; }
    .fa-wrap { max-width: 800px; margin: 0 auto; padding-bottom: 3rem; }
    .fa-aktionen { display: flex; flex-wrap: wrap; gap: 0.5rem; margin: 1rem 0; }
    .fa-status { min-height: 1.4rem; color: #166534; }
    .fa-eintrag { border-left: 3px solid var(--c2); padding: 0.5rem 0.75rem; margin-top: 0.75rem; background: rgba(0,0,0,0.03); border-radius: 4px; white-space: pre-wrap; }
  </style>
</head>
<body>

  <nav class="navbar" role="navigation" aria-label="Hauptnavigation">
    <div class="container navbar-inner">
      <a href="https://lehrer-herrmann.de" class="navbar-logo">lehrer-herrmann.de</a>
      <button class="hamburger" id="hamburger" aria-label="Menü öffnen" aria-expanded="false" aria-controls="navbar-links">
        <span></span><span></span><span></span>
      </button>
      <ul class="navbar-links" id="navbar-links">
        <li><a href="https://lehrer-herrmann.de/#was-ist-neu">Was ist neu?</a></li>
        <li><a href="https://lehrer-herrmann.de/kontakt.html">Kontakt</a></li>
        <li class="navbar-gb-trenner" aria-hidden="true"><span class="navbar-gb-label">Geschützter Bereich</span></li>
        <li><a href="/profil.html" class="navbar-gb-link">⚔️ Arena</a></li>
        <li><a href="https://lehrer-herrmann.de/blog.html" class="navbar-gb-link">✍️ Blog</a></li>
        <li><a href="https://lehrer-herrmann.de/faecher.html" class="navbar-gb-link">📚 Fächer</a></li>
      </ul>
      <div id="kolosseum-widget" aria-label="Kolosseum-Anmeldung" style="display:none"></div>
    </div>
  </nav>

  <nav class="nav admin-nav">
    <a href="/admin/dashboard.html" class="nav-brand">⚙️ Admin</a>
    <div class="nav-links">
      <a href="/admin/dashboard.html">Dashboard</a>
      <a href="/admin/fortbildung.html" class="active">Fortbildung</a>
      <button id="logout-btn" class="btn btn-ghost nav-action" style="font-size:.85rem">Ausloggen</button>
    </div>
  </nav>

  <main class="container fa-wrap">
    <h1>📝 Fortbildung auswerten</h1>
    <p id="fa-anzahl">Lade …</p>
    <div class="fa-aktionen">
      <button type="button" class="btn btn-primary" id="fa-kopieren">Alle Antworten kopieren</button>
      <button type="button" class="btn" id="fa-md">Markdown herunterladen</button>
      <button type="button" class="btn" id="fa-csv">CSV herunterladen</button>
      <button type="button" class="btn" id="fa-neu">Neu laden</button>
      <button type="button" class="btn" id="fa-loeschen" style="color:#dc2626">Alle löschen</button>
    </div>
    <div class="fa-status" id="fa-status" role="status" aria-live="polite"></div>
    <div id="fa-liste"></div>
  </main>

  <script>
    (function () {
      let eintraege = [];
      const statusEl = document.getElementById('fa-status');

      function textFuerClaude() {
        return eintraege.map((e, i) =>
          `Antwort ${i + 1}\n` +
          `Das hat mir gefallen: ${e.gefallen || '–'}\n` +
          `Das würde ich ändern: ${e.aendern || '–'}\n` +
          `Mein wichtigster nächster Schritt: ${e.naechster_schritt || '–'}`
        ).join('\n\n');
      }

      function markdown() {
        return '# Rückmeldungen zur Fortbildung\n\n' + eintraege.map((e, i) =>
          `## Antwort ${i + 1}\n\n` +
          `- **Das hat mir gefallen:** ${(e.gefallen || '–').replace(/\n/g, ' ')}\n` +
          `- **Das würde ich ändern:** ${(e.aendern || '–').replace(/\n/g, ' ')}\n` +
          `- **Mein wichtigster nächster Schritt:** ${(e.naechster_schritt || '–').replace(/\n/g, ' ')}`
        ).join('\n\n') + '\n';
      }

      function csv() {
        const q = s => '"' + String(s || '').replace(/"/g, '""') + '"';
        const zeilen = [['Nr', 'Das hat mir gefallen', 'Das würde ich ändern', 'Mein wichtigster nächster Schritt'].map(q).join(';')];
        eintraege.forEach((e, i) => zeilen.push([i + 1, e.gefallen, e.aendern, e.naechster_schritt].map(q).join(';')));
        return '\uFEFF' + zeilen.join('\r\n') + '\r\n';
      }

      function herunterladen(name, inhalt, typ) {
        const a = document.createElement('a');
        a.href = URL.createObjectURL(new Blob([inhalt], { type: typ }));
        a.download = name;
        a.click();
        URL.revokeObjectURL(a.href);
      }

      function meldung(t) { statusEl.textContent = t; }

      async function kopieren(text) {
        try {
          await navigator.clipboard.writeText(text);
        } catch {
          const ta = document.createElement('textarea');
          ta.value = text; document.body.appendChild(ta); ta.select();
          document.execCommand('copy'); ta.remove();
        }
      }

      function anzeigen() {
        document.getElementById('fa-anzahl').textContent =
          eintraege.length === 1 ? '1 Einsendung' : eintraege.length + ' Einsendungen';
        const liste = document.getElementById('fa-liste');
        liste.textContent = '';
        eintraege.forEach((e, i) => {
          const d = document.createElement('div');
          d.className = 'fa-eintrag';
          d.textContent = `Antwort ${i + 1}\nGefallen: ${e.gefallen || '–'}\nÄndern: ${e.aendern || '–'}\nNächster Schritt: ${e.naechster_schritt || '–'}`;
          liste.appendChild(d);
        });
      }

      async function laden() {
        const res = await fetch('/api/fortbildung');
        if (res.status === 401) { window.location.href = '/admin/'; return; }
        if (!res.ok) { meldung('Fehler beim Laden.'); return; }
        eintraege = await res.json();
        anzeigen();
      }

      document.getElementById('fa-kopieren').addEventListener('click', async () => {
        if (!eintraege.length) { meldung('Noch keine Einsendungen.'); return; }
        await kopieren(textFuerClaude());
        meldung('✓ ' + eintraege.length + ' Antworten in die Zwischenablage kopiert.');
      });
      document.getElementById('fa-md').addEventListener('click', () => herunterladen('fortbildung-rueckmeldungen.md', markdown(), 'text/markdown;charset=utf-8'));
      document.getElementById('fa-csv').addEventListener('click', () => herunterladen('fortbildung-rueckmeldungen.csv', csv(), 'text/csv;charset=utf-8'));
      document.getElementById('fa-neu').addEventListener('click', () => laden().then(() => meldung('Aktualisiert.')));
      const loeschBtn = document.getElementById('fa-loeschen');
      let geplantAm = null;

      function datumDe(sqlUtc) {
        return new Date(sqlUtc.replace(' ', 'T') + 'Z').toLocaleDateString('de-DE');
      }

      function loeschButtonAktualisieren() {
        if (geplantAm) {
          loeschBtn.textContent = 'Löschung am ' + datumDe(geplantAm) + ' – rückgängig machen';
          loeschBtn.style.color = '#6b7280';
          loeschBtn.style.background = '#e5e7eb';
        } else {
          loeschBtn.textContent = 'Alle löschen';
          loeschBtn.style.color = '#dc2626';
          loeschBtn.style.background = '';
        }
      }

      async function loeschStatusLaden() {
        const res = await fetch('/api/fortbildung/loeschung');
        if (res.ok) geplantAm = (await res.json()).geplant_am;
        loeschButtonAktualisieren();
      }

      loeschBtn.addEventListener('click', async () => {
        try {
          if (geplantAm) {
            const res = await fetch('/api/fortbildung/loeschung', { method: 'DELETE' });
            if (!res.ok) { meldung('Rückgängig machen fehlgeschlagen.'); return; }
            geplantAm = null;
            loeschButtonAktualisieren();
            meldung('✓ Geplante Löschung rückgängig gemacht.');
            return;
          }
          if (!confirm('Sollen alle Daten in 7 Tagen gelöscht werden?')) return;
          const res = await fetch('/api/fortbildung/loeschung', { method: 'POST' });
          if (!res.ok) { meldung('Löschung konnte nicht geplant werden.'); return; }
          geplantAm = (await res.json()).geplant_am;
          loeschButtonAktualisieren();
          meldung('✓ Alle Daten werden am ' + datumDe(geplantAm) + ' gelöscht. Bis dahin ist das rückgängig zu machen.');
        } catch {
          meldung('Verbindungsfehler.');
        }
      });
      document.getElementById('logout-btn').addEventListener('click', async () => {
        await fetch('/api/auth/admin/logout', { method: 'POST' });
        window.location.href = '/admin/index.html';
      });

      laden().then(loeschStatusLaden).catch(() => meldung('Verbindungsfehler.'));
    })();
  </script>
  <script src="/js/main.js?v=20260615c"></script>
  <script src="/js/kolosseum-login-widget.js"></script>
