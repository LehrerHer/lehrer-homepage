<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" font-family="system-ui, sans-serif">
  <rect x="0" y="0" width="560" height="360" fill="#ffffff"/>
  <!-- Gehäuse -->
  <rect x="20" y="20" width="330" height="320" rx="10" fill="#e9eef6" stroke="#1e3a5f" stroke-width="4"/>
  <!-- Hauptplatine -->
  <rect x="45" y="45" width="230" height="220" rx="4" fill="#2f6b4f" stroke="#1e3a5f" stroke-width="2"/>
  <g stroke="#7fb89c" stroke-width="2" fill="none" opacity="0.7">
    <path d="M60 250 H140 V200"/><path d="M180 250 V215 H255"/><path d="M60 70 V120 H95"/>
  </g>
  <!-- CPU-Kühler mit Lüfter -->
  <rect x="80" y="80" width="80" height="80" rx="6" fill="#c9d2df" stroke="#1e3a5f" stroke-width="3"/>
  <circle cx="120" cy="120" r="30" fill="#ffffff" stroke="#1e3a5f" stroke-width="3"/>
  <g fill="#1e3a5f"><path d="M120 120 L120 94 Q132 102 120 120Z"/><path d="M120 120 L146 120 Q138 132 120 120Z"/><path d="M120 120 L120 146 Q108 138 120 120Z"/><path d="M120 120 L94 120 Q102 108 120 120Z"/></g>
  <circle cx="120" cy="120" r="5" fill="#f28c28"/>
  <!-- RAM-Riegel -->
  <g fill="#1f3d6e" stroke="#ffffff" stroke-width="1">
    <rect x="190" y="60" width="12" height="120"/><rect x="208" y="60" width="12" height="120"/>
  </g>
  <g fill="#f28c28"><rect x="192" y="75" width="8" height="10"/><rect x="192" y="100" width="8" height="10"/><rect x="192" y="125" width="8" height="10"/><rect x="210" y="75" width="8" height="10"/><rect x="210" y="100" width="8" height="10"/><rect x="210" y="125" width="8" height="10"/></g>
  <!-- SSD (M.2) -->
  <rect x="90" y="205" width="110" height="22" rx="3" fill="#1b2433"/>
  <rect x="100" y="210" width="25" height="12" fill="#c9d2df"/><rect x="132" y="210" width="25" height="12" fill="#c9d2df"/>
  <!-- Netzteil -->
  <rect x="45" y="280" width="140" height="48" rx="4" fill="#5b6577" stroke="#1e3a5f" stroke-width="2"/>
  <g stroke="#c9d2df" stroke-width="2"><line x1="60" y1="290" x2="60" y2="318"/><line x1="70" y1="290" x2="70" y2="318"/><line x1="80" y1="290" x2="80" y2="318"/><line x1="90" y1="290" x2="90" y2="318"/></g>
  <circle cx="160" cy="304" r="10" fill="#1b2433"/>
  <g stroke="#f28c28" stroke-width="2.5" fill="none">
    <path d="M150 85 L178 38 L370 65"/><path d="M220 130 L370 128"/><path d="M200 216 L370 192"/><path d="M262 245 L370 254"/><path d="M185 315 L370 316"/>
  </g>
  <g fill="#f28c28"><circle cx="150" cy="85" r="5"/><circle cx="220" cy="130" r="5"/><circle cx="200" cy="216" r="5"/><circle cx="262" cy="245" r="5"/><circle cx="185" cy="315" r="5"/></g>
  <g font-size="17" fill="#1e3a5f">
    <text x="376" y="70" font-weight="700">Prozessor (CPU)</text><text x="376" y="88" font-size="13" fill="#5b6577">unter Kühler mit Lüfter</text>
    <text x="376" y="133" font-weight="700">Arbeitsspeicher</text><text x="376" y="151" font-size="13" fill="#5b6577">(RAM) – schmale Riegel</text>
    <text x="376" y="197" font-weight="700">Festplatte / SSD</text><text x="376" y="215" font-size="13" fill="#5b6577">hier: SSD als kleiner Streifen</text>
    <text x="376" y="259" font-weight="700">Hauptplatine</text><text x="376" y="277" font-size="13" fill="#5b6577">(Mainboard)</text>
    <text x="376" y="321" font-weight="700">Netzteil</text>
  </g>
</svg>
